name: Windows validation and private installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Require a private repository for installer delivery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $private = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $private -ne 'true') {
            throw 'This workflow only delivers installers to a private repository.'
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and build frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Rust networking and discovery
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run tauri build
      - name: Save installer to an unpublished private draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $private = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $private -ne 'true') {
            throw 'Repository must remain private.'
          }
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $installer = $installers[0].FullName
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content -Encoding utf8 'SHA256SUMS.txt'
          $tag = "netpilot-ci-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          @(
            'Unpublished private Windows x64 test build. Unsigned installer; install Npcap separately.'
            ''
            "Source commit: $env:GITHUB_SHA"
            "Windows CI: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ''
            'Frontend checks and eight offline Rust tests passed. Home-network runtime and recovery remain unverified.'
            'Only selected redirected IPv4 is shaped or blocked. IPv6 and bypass paths remain uncontrolled.'
            'No public release or automatic publication is performed.'
          ) | Set-Content -Encoding utf8 'build-notes.txt'
          gh release create $tag $installer 'SHA256SUMS.txt' 'README.md' --draft --target $env:GITHUB_SHA --title "NetPilot Windows test build $env:GITHUB_RUN_NUMBER" --notes-file 'build-notes.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Private draft delivery failed.' }
          $release = gh release view $tag --json isDraft,url,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'Delivery must remain an unpublished draft.' }
          "Installer saved to private draft: $($release.url)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Source commit: $env:GITHUB_SHA" | Add-Content $env:GITHUB_STEP_SUMMARY
          "SHA256: $hash" | Add-Content $env:GITHUB_STEP_SUMMARY
