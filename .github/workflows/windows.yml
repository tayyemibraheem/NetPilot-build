name: Windows validation and signed test installer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: netpilot-windows-delivery
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Require the approved public build mirror
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'tayyemibraheem/NetPilot-build') { throw 'Use only the approved build mirror.' }
          $private = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $private -ne 'false') { throw 'Expected the approved public build mirror.' }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and build frontend
        run: npm run build
      - name: Test device identity state
        run: npm test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test networking, diagnostics, rates and update safety
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build and sign Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build
      - name: Verify signatures and deliver experimental installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $private = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $private -ne 'false') { throw 'Expected approved public repository.' }
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          $installer = $installers[0].FullName
          $signature = "$installer.sig"
          if (-not (Test-Path $signature)) { throw 'Signed updater artifact is missing.' }
          node scripts/verify-update.mjs $installer $signature
          if ($LASTEXITCODE -ne 0) { throw 'Cryptographic update verification failed.' }
          $tag = "netpilot-ci-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          node scripts/create-update.mjs $installer $signature $tag
          if ($LASTEXITCODE -ne 0) { throw 'Updater manifest generation failed.' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content -Encoding utf8 'SHA256SUMS.txt'
          @(
            'Experimental Windows x64 test build. Tauri update signature is not Windows Authenticode.'
            'Install Npcap separately once; no Npcap binary or installer is redistributed.'
            "Source commit: $env:GITHUB_SHA"
            "CI: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'Frontend and offline Rust tests passed. Actual Windows driver, forwarding, recovery and update-install flows still require live validation.'
            'Preserves the original error through cleanup, adds bounded local name lookups and labels, measured observed/forwarded rates, setup checks, and signed updates that stop network helpers before installation.'
            'This is not a confirmed fix for the reported device error until its original operation/message is captured.'
            'IPv6 and traffic bypassing the PC remain uncontrolled. Install this version once manually if upgrading from 0.1.0.'
          ) | Set-Content -Encoding utf8 'build-notes.txt'
          gh release create $tag $installer $signature 'SHA256SUMS.txt' 'README.md' 'latest.json' --prerelease --latest=false --target $env:GITHUB_SHA --title "NetPilot Windows test build $env:GITHUB_RUN_NUMBER" --notes-file 'build-notes.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Installer delivery failed.' }
          # A fixed prerelease hosts only the rolling manifest. Binary URLs remain immutable.
          gh release view netpilot-updates --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            New-Item -ItemType Directory -Force 'previous-update' | Out-Null
            gh release download netpilot-updates --pattern 'latest.json' --dir 'previous-update'
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the previous update channel safely.' }
            $previous = Get-Content 'previous-update/latest.json' -Raw | ConvertFrom-Json
            $current = Get-Content 'latest.json' -Raw | ConvertFrom-Json
            if ([version]$previous.version -gt [version]$current.version) { throw 'Refusing to roll back the update channel.' }
            gh release upload netpilot-updates 'latest.json' --clobber
          } else {
            gh release create netpilot-updates 'latest.json' --prerelease --latest=false --target $env:GITHUB_SHA --title 'NetPilot signed update channel' --notes 'Rolling manifest for explicitly enabled experimental NetPilot updates. Payloads are version-bound and signed; network helpers must stop before installation.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Update channel delivery failed.' }
          $release = gh release view $tag --json isDraft,isPrerelease,url,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or -not $release.isPrerelease) { throw 'Expected a downloadable experimental prerelease.' }
          "Installer: $($release.url)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Source: $env:GITHUB_SHA" | Add-Content $env:GITHUB_STEP_SUMMARY
          "SHA256: $hash" | Add-Content $env:GITHUB_STEP_SUMMARY
